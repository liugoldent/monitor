x-app-build: &app-build
  context: .
  network: host
x-app-image: &app-image monitor-app:local
x-runtime-safety: &runtime-safety
  restart: unless-stopped
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  telegram-signal-relay:
    <<: *runtime-safety
    build: *app-build
    image: *app-image
    container_name: monitor-telegram-signal-relay
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 256m
    command: ["python", "/app/backend-futures-py/telegram_signal_relay.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      TELEGRAM_RELAY_SESSION_PATH: /app/backend-futures-py/telegram-relay-runtime/session_h_ef_relay
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/telegram-relay-runtime:/app/backend-futures-py/telegram-relay-runtime
      - ./backend-futures-py/telegram-relay-records:/app/backend-futures-py/telegram-relay-records
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./scripts/shared/initialize_telegram_session.py:/app/scripts/initialize_telegram_session.py:ro

  monitor-mxf:
    <<: *runtime-safety
    build: *app-build
    image: *app-image
    container_name: monitor-mxf
    cpus: "0.25"
    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 256m
    command: ["python", "/app/backend-futures-py/monitor_mxf.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  webhook-server:
    <<: *runtime-safety
    build: *app-build
    image: *app-image
    container_name: monitor-webhook-server
    cpus: "0.15"
    mem_limit: 128m
    mem_reservation: 32m
    memswap_limit: 128m
    command: ["python", "/app/backend-futures-py/webhook_server.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  ef-strong-consensus-morning-flat-strategy:
    <<: *runtime-safety
    # Legacy service identifier retained so runtime/order state is reused.
    build: *app-build
    image: *app-image
    container_name: monitor-ef-strong-consensus-morning-flat-strategy
    cpus: "0.40"
    # A process-long Shioaji session initializes contracts and native Solace
    # resources; allow the same measured headroom as the account-2 strategy.
    mem_limit: 768m
    mem_reservation: 256m
    memswap_limit: 768m
    command: ["python", "/app/backend-futures-py/ef-strong-consensus-morning-flat-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/ef-strong-consensus-morning-flat-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      CA_PATH: /app/backend-futures-py/Sinopac.pfx
      EF_HYSTERESIS_MORNING_FLAT_ENABLE_ORDERS: "true"
    depends_on:
      - telegram-signal-relay
      - webhook-server
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc:ro
      - ./backend-futures-py/ef-strong-consensus-morning-flat-strategy/records:/app/backend-futures-py/ef-strong-consensus-morning-flat-strategy/records
      - ./backend-futures-py/ef-strong-consensus-morning-flat-strategy/runtime:/app/backend-futures-py/ef-strong-consensus-morning-flat-strategy/runtime

  ef-morning-weekend-hedge-strategy:
    <<: *runtime-safety
    build: *app-build
    image: *app-image
    container_name: monitor-ef-morning-weekend-hedge-strategy
    cpus: "0.35"
    # Shioaji contract initialization peaks above 320 MB and was OOM-killed.
    mem_limit: 768m
    mem_reservation: 256m
    memswap_limit: 768m
    command: ["python", "/app/backend-futures-py/ef-morning-weekend-hedge-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/ef-morning-weekend-hedge-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      CA_PATH: /app/backend-futures-py/Sinopac.pfx
      CA_PATH2: /app/backend-futures-py/Sinopac.pfx
    depends_on:
      - telegram-signal-relay
      - webhook-server
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc:ro
      - ./backend-futures-py/ef-morning-weekend-hedge-strategy/config:/app/backend-futures-py/ef-morning-weekend-hedge-strategy/config:ro
      - ./backend-futures-py/ef-morning-weekend-hedge-strategy/records:/app/backend-futures-py/ef-morning-weekend-hedge-strategy/records
      - ./backend-futures-py/ef-morning-weekend-hedge-strategy/runtime:/app/backend-futures-py/ef-morning-weekend-hedge-strategy/runtime

  ef-hysteresis-again-strategy:
    <<: *runtime-safety
    build: *app-build
    image: *app-image
    container_name: monitor-ef-hysteresis-again-strategy
    cpus: "0.20"
    mem_limit: 256m
    mem_reservation: 64m
    memswap_limit: 256m
    command: ["python", "/app/backend-futures-py/ef-hysteresis-again-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/ef-hysteresis-again-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    depends_on:
      - telegram-signal-relay
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc:ro
      - ./backend-futures-py/ef-hysteresis-again-strategy/records:/app/backend-futures-py/ef-hysteresis-again-strategy/records
      - ./backend-futures-py/ef-hysteresis-again-strategy/runtime:/app/backend-futures-py/ef-hysteresis-again-strategy/runtime

  cloudflared:
    <<: *runtime-safety
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: monitor-cloudflared
    cpus: "0.15"
    mem_limit: 128m
    mem_reservation: 32m
    memswap_limit: 128m
    command: ["tunnel", "run"]
    environment:
      TZ: Asia/Taipei
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - webhook-server

  monitor:
    <<: *runtime-safety
    profiles: ["legacy"]
    build: *app-build
    image: *app-image
    container_name: monitor-services
    cpus: "1.00"
    mem_limit: 1024m
    mem_reservation: 256m
    memswap_limit: 1024m
    environment:
      TZ: Asia/Taipei
      RUN_SERVICES_DOCKER: "1"
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:-}
    ports:
      - "8080:8080"
      - "5050:5050"
      - "5173:5173"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/stockTech:/app/backend-futures-py/stockTech
      - ./backend-futures-py/telegram-relay-runtime:/app/backend-futures-py/telegram-relay-runtime
      - ./backend-futures-py/telegram-relay-records:/app/backend-futures-py/telegram-relay-records
      - ./backend-heyu-node/.env:/app/backend-heyu-node/.env:ro
      - ./frontend-vue/.env:/app/frontend-vue/.env:ro
      - ./frontend-vue/public/institutional:/app/frontend-vue/public/institutional
