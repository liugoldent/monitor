services:
  monitor-mxf:
    profiles: ["windows"]
    build:
      context: .
    container_name: monitor-mxf
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/monitor_mxf.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  webhook-server:
    profiles: ["windows"]
    build:
      context: .
    container_name: monitor-webhook-server
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/webhook_server.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  h3-ef-012-strategy:
    profiles: ["windows"]
    build:
      context: .
    container_name: monitor-h3-ef-012-strategy
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/h3-ef-012-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/h3-ef-012-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/h3-ef-012-strategy/records:/app/backend-futures-py/h3-ef-012-strategy/records
      - ./backend-futures-py/h3-ef-012-strategy/runtime:/app/backend-futures-py/h3-ef-012-strategy/runtime
      - ./scripts/shared/initialize_telegram_session.py:/app/scripts/initialize_telegram_session.py:ro

  ef-rsi60-filter-strategy:
    profiles: ["windows"]
    build:
      context: .
    container_name: monitor-ef-rsi60-filter-strategy
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/ef-rsi60-filter-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/ef-rsi60-filter-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/ef-rsi60-filter-strategy/records:/app/backend-futures-py/ef-rsi60-filter-strategy/records
      - ./backend-futures-py/ef-rsi60-filter-strategy/runtime:/app/backend-futures-py/ef-rsi60-filter-strategy/runtime

  cloudflared:
    profiles: ["windows"]
    build:
      context: .
    container_name: monitor-cloudflared
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec cloudflared tunnel run --token "$${CLOUDFLARED_TOKEN}"
    environment:
      TZ: Asia/Taipei
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - webhook-server

  monitor:
    build:
      context: .
    container_name: monitor-services
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      RUN_SERVICES_DOCKER: "1"
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:-}
    ports:
      - "8080:8080"
      - "5050:5050"
      - "5173:5173"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/stockTech:/app/backend-futures-py/stockTech
      - ./backend-futures-py/session_monitor_six_strategy.session:/app/backend-futures-py/session_monitor_six_strategy.session
      - ./backend-heyu-node/.env:/app/backend-heyu-node/.env:ro
      - ./frontend-vue/.env:/app/frontend-vue/.env:ro
      - ./frontend-vue/public/institutional:/app/frontend-vue/public/institutional
