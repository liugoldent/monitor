services:
  six-strategy:
    build:
      context: .
    container_name: monitor-six-strategy
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/monitor_and_trade_six_strategy.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/stockTech:/app/backend-futures-py/stockTech
      - ./backend-futures-py/session_monitor_six_strategy.session:/app/backend-futures-py/session_monitor_six_strategy.session
      - ./scripts/initialize_telegram_session.py:/app/scripts/initialize_telegram_session.py:ro

  monitor-mxf:
    build:
      context: .
    container_name: monitor-mxf
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/monitor_mxf.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  webhook-server:
    build:
      context: .
    container_name: monitor-webhook-server
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/webhook_server.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  cloudflared:
    build:
      context: .
    container_name: monitor-cloudflared
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec cloudflared tunnel run --token "$${CLOUDFLARED_TOKEN}"
    environment:
      TZ: Asia/Taipei
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:?Set CLOUDFLARED_TOKEN in the root .env file}
    depends_on:
      - webhook-server

  monitor:
    profiles: ["legacy-all-in-one"]
    build:
      context: .
    container_name: monitor-services
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      RUN_SERVICES_DOCKER: "1"
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:-}
    ports:
      - "8080:8080"
      - "5050:5050"
      - "5173:5173"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/stockTech:/app/backend-futures-py/stockTech
      - ./backend-futures-py/session_monitor.session:/app/backend-futures-py/session_monitor.session
      - ./backend-heyu-node/.env:/app/backend-heyu-node/.env:ro
      - ./frontend-vue/.env:/app/frontend-vue/.env:ro
      - ./frontend-vue/public/institutional:/app/frontend-vue/public/institutional
      - ./shioaji_demo_shane/.env:/app/shioaji_demo_shane/.env:ro
      - ./shioaji_demo_shane/Sinopac.pfx:/app/shioaji_demo_shane/Sinopac.pfx:ro
      - ./shioaji_demo_shane/session_monitor.session:/app/shioaji_demo_shane/session_monitor.session
      - ./shioaji_demo_rosco/.env:/app/shioaji_demo_rosco/.env:ro
      - ./shioaji_demo_rosco/Sinopac.pfx:/app/shioaji_demo_rosco/Sinopac.pfx:ro
      - ./shioaji_demo_rosco/session_monitor.session:/app/shioaji_demo_rosco/session_monitor.session
      - ./shioaji_demo_ichih/.env:/app/shioaji_demo_ichih/.env:ro
      - ./shioaji_demo_ichih/Sinopac.pfx:/app/shioaji_demo_ichih/Sinopac.pfx:ro
      - ./shioaji_demo_ichih/session_monitor.session:/app/shioaji_demo_ichih/session_monitor.session
      - ./shioaji_demo_ichih/shioaji.log:/app/shioaji_demo_ichih/shioaji.log
