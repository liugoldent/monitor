services:
  telegram-signal-relay:
    build:
      context: .
    container_name: monitor-telegram-signal-relay
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/telegram_signal_relay.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      TELEGRAM_RELAY_SESSION_PATH: /app/backend-futures-py/h3-ef-012-strategy/runtime/session_h3_ef_012
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/h3-ef-012-strategy/runtime:/app/backend-futures-py/h3-ef-012-strategy/runtime
      - ./backend-futures-py/h3-ef-012-strategy/records:/app/backend-futures-py/h3-ef-012-strategy/records
      - ./backend-futures-py/telegram-relay-records:/app/backend-futures-py/telegram-relay-records
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  monitor-mxf:
    build:
      context: .
    container_name: monitor-mxf
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/monitor_mxf.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  webhook-server:
    build:
      context: .
    container_name: monitor-webhook-server
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/webhook_server.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    ports:
      - "8080:8080"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc

  regression-mean-reversion-morning-flat-strategy:
    build:
      context: .
    container_name: monitor-regression-mean-reversion-morning-flat-strategy
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/regression-mean-reversion-morning-flat-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/regression-mean-reversion-morning-flat-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      CA_PATH: /app/backend-futures-py/Sinopac.pfx
      MEAN_REVERSION_ENABLE_ORDERS: "true"
    depends_on:
      - telegram-signal-relay
      - webhook-server
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/regression-mean-reversion-morning-flat-strategy/records:/app/backend-futures-py/regression-mean-reversion-morning-flat-strategy/records
      - ./backend-futures-py/regression-mean-reversion-morning-flat-strategy/runtime:/app/backend-futures-py/regression-mean-reversion-morning-flat-strategy/runtime

  six-strategy-listener:
    profiles: ["strategies"]
    build:
      context: .
    container_name: monitor-six-strategy-listener
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/monitor_and_trade_six_strategy.py"]
    working_dir: /app/backend-futures-py
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/session_monitor_six_strategy.session:/app/backend-futures-py/session_monitor_six_strategy.session

  h3-ef-012-strategy:
    profiles: ["strategies"]
    build:
      context: .
    container_name: monitor-h3-ef-012-strategy
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/h3-ef-012-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/h3-ef-012-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/h3-ef-012-strategy/records:/app/backend-futures-py/h3-ef-012-strategy/records
      - ./backend-futures-py/h3-ef-012-strategy/runtime:/app/backend-futures-py/h3-ef-012-strategy/runtime
      - ./scripts/shared/initialize_telegram_session.py:/app/scripts/initialize_telegram_session.py:ro

  ef-strong-consensus-morning-flat-strategy:
    build:
      context: .
    container_name: monitor-ef-strong-consensus-morning-flat-strategy
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/ef-strong-consensus-morning-flat-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/ef-strong-consensus-morning-flat-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
      CA_PATH: /app/backend-futures-py/Sinopac.pfx
      EF_STRONG_MORNING_FLAT_ENABLE_ORDERS: "true"
    depends_on:
      - telegram-signal-relay
      - webhook-server
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/ef-strong-consensus-morning-flat-strategy/records:/app/backend-futures-py/ef-strong-consensus-morning-flat-strategy/records
      - ./backend-futures-py/ef-strong-consensus-morning-flat-strategy/runtime:/app/backend-futures-py/ef-strong-consensus-morning-flat-strategy/runtime

  ef-rsi60-filter-strategy:
    profiles: ["strategies"]
    build:
      context: .
    container_name: monitor-ef-rsi60-filter-strategy
    restart: unless-stopped
    command: ["python", "/app/backend-futures-py/ef-rsi60-filter-strategy/monitor_and_trade.py"]
    working_dir: /app/backend-futures-py/ef-rsi60-filter-strategy
    environment:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/ef-rsi60-filter-strategy/records:/app/backend-futures-py/ef-rsi60-filter-strategy/records
      - ./backend-futures-py/ef-rsi60-filter-strategy/runtime:/app/backend-futures-py/ef-rsi60-filter-strategy/runtime

  cloudflared:
    profiles: ["tunnel"]
    build:
      context: .
    container_name: monitor-cloudflared
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec cloudflared tunnel run --token "$${CLOUDFLARED_TOKEN}"
    environment:
      TZ: Asia/Taipei
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:-}
    depends_on:
      - webhook-server

  monitor:
    profiles: ["legacy"]
    build:
      context: .
    container_name: monitor-services
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      RUN_SERVICES_DOCKER: "1"
      CLOUDFLARED_TOKEN: ${CLOUDFLARED_TOKEN:-}
    ports:
      - "8080:8080"
      - "5050:5050"
      - "5173:5173"
    volumes:
      - ./backend-futures-py/.env:/app/backend-futures-py/.env:ro
      - ./backend-futures-py/Sinopac.pfx:/app/backend-futures-py/Sinopac.pfx:ro
      - ./backend-futures-py/tv_doc:/app/backend-futures-py/tv_doc
      - ./backend-futures-py/stockTech:/app/backend-futures-py/stockTech
      - ./backend-futures-py/session_monitor_six_strategy.session:/app/backend-futures-py/session_monitor_six_strategy.session
      - ./backend-heyu-node/.env:/app/backend-heyu-node/.env:ro
      - ./frontend-vue/.env:/app/frontend-vue/.env:ro
      - ./frontend-vue/public/institutional:/app/frontend-vue/public/institutional
