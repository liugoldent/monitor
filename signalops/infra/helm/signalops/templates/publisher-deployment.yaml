{{- if .Values.publisher.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "signalops.name" . }}-publisher
  labels:
    {{- include "signalops.labels" . | nindent 4 }}
    app.kubernetes.io/component: publisher
spec:
  replicas: {{ .Values.publisher.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "signalops.name" . }}
      app.kubernetes.io/component: publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "signalops.name" . }}
        app.kubernetes.io/component: publisher
    spec:
      containers:
        - name: publisher
          image: "{{ .Values.publisher.image }}:{{ .Values.publisher.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["signalops-publisher"]
          envFrom:
            - configMapRef:
                name: {{ include "signalops.name" . }}
          env:
            - name: SIGNALOPS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretRef.name }}
                  key: {{ .Values.secretRef.databaseUrlKey }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
{{- end }}
