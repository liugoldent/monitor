      cursor: pointer;
      width: auto;
      display: inline-block;
      transition: all 0.2s;

      font-size: 14px;
      margin-bottom: 20px;
    }

      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 16px;
    }

      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
    }
    .user-info .user-details {
      text-align: left;
    }
    .user-info .user-details .name {
      font-weight: bold;
      color: #333;
      font-size: 16px;
    }
    .user-info .user-details .email {
      color: #666;
      font-size: 13px;
    }
    .logout-btn {
      background: #6c757d;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.2s;
    }
    .logout-btn:hover { opacity: 0.9; }
    
    #g_id_onload { display: none; }
    #google-signin-btn { display: flex; justify-content: center; margin-top: 10px; }

      background-color: #eef2f7;
      padding: 12px;
      border-radius: 8px;
      margin: 15px 0;
    }
    .clock-date {
      font-size: 14px;
      color: #666;
    }
    .clock-time {
      font-size: 26px;
      font-weight: bold;
      color: #1a73e8;
      font-family: monospace;
      margin-top: 4px;
    }

    .section-title {
      font-size: 14px;
      color: #666;
      margin: 15px 0 8px 0;
      text-align: left;
      font-weight: bold;
    }
    .btn-group {
      display: flex;
      gap: 10px;
    }
    button.action-btn {
      flex: 1;
      padding: 12px 8px;
      font-size: 15px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button.action-btn:hover { opacity: 0.9; }
    button.action-btn:disabled { background-color: #cccccc !important; cursor: not-allowed; opacity: 0.7; }
    
    .btn-in { background-color: #28a745; color: white; }
    .btn-out { background-color: #dc3545; color: white; }
    .btn-check { background-color: #17a2b8; color: white; width: 100%; }

      font-size: 14px;
      color: #333;
      word-break: break-all;

      zh: {
        loginTitle: "欢迎使用",
        loginDesc: "请使用 Google 帐户登录以开始打卡",
        logout: "退出登录",
        title: "线上打卡系統",
        general: "📅 一般出勤",
        check: "📋 在岗查核",
        btnIn: "🟢 上班打卡",
        btnOut: "🔴 下班打卡",
        btnCheck: "🔵 在岗确认打卡",
        processing: "数据处理中...",
        success: "✅ 打卡成功！",
        error: "❌ 错误：",
        pleaseLogin: "🔒 請先登录",
        alreadyDone: "⚠️ 今天已经完成此项打卡，无需重复打卡！"
      },
      en: {
        loginTitle: "Welcome",
        loginDesc: "Please sign in with Google to start clocking",
        logout: "Sign Out",
        title: "Remote Attendance",
        general: "📅 General Attendance",
        check: "📋 On-Duty Check",
        btnIn: "🟢 Clock In",
        btnOut: "🔴 Clock Out",
        btnCheck: "🔵 On-Duty Confirm",
        processing: "Processing...",
        success: "✅ Clock-in successful!",
        error: "❌ Error: ",
        pleaseLogin: "🔒 Please Sign In First",
        alreadyDone: "⚠️ You have already completed this clock-in today!"
      }
    };

    window.onload = function() {
      sessionStorage.clear();
      const savedUser = sessionStorage.getItem('googleUser');
      if (savedUser) {
        try {
          currentUser = JSON.parse(savedUser);
          showLoggedInState();
        } catch (e) {
          sessionStorage.removeItem('googleUser');
        }
      }
      initializeGoogleOneTap();
      setInterval(updateClock, 1000);
      updateClock();
    };

    function initializeGoogleOneTap() {
      if (typeof google === 'undefined' || !google.accounts) {
        setTimeout(initializeGoogleOneTap, 100);
        return;
      }
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        auto_select: false,
        cancel_on_tap_outside: true
      });
      google.accounts.id.prompt();
      google.accounts.id.renderButton(
        document.getElementById('google-signin-btn'),
        { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular', logo_alignment: 'left', width: 280 }
      );
    }

    window.handleCredentialResponse = function(response) {
      try {
        const payload = parseJwt(response.credential);
        currentUser = {
          idToken: response.credential,
          uid: payload.sub,
          email: payload.email,
          name: payload.name,
          picture: payload.picture
        };
        sessionStorage.setItem('googleUser', JSON.stringify(currentUser));
        showLoggedInState();
      } catch (error) {
        console.error("解析失败", error);
      }
    };

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
      return JSON.parse(jsonPayload);
    }

    function showLoggedInState() {
      document.getElementById('login-section').style.display = 'none';
      document.getElementById('user-info').style.display = 'flex';
      document.getElementById('user-photo').src = currentUser.picture;
      document.getElementById('user-name').textContent = currentUser.name;
      document.getElementById('user-email').textContent = currentUser.email;
      document.getElementById('logout-btn').style.display = 'inline-block';
      document.getElementById('attendance-area').style.display = 'block';

      checkTodayStatus();
    }

    function checkTodayStatus() {
      const btnIn = document.getElementById('btn-in');
      const btnOut = document.getElementById('btn-out');

      btnIn.disabled = false;
      btnOut.disabled = false;
    }

    function signOut() {
      if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.disableAutoSelect();
      }
      sessionStorage.clear();
      currentUser = null;
      location.reload();
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.getElementById('btn-zh').classList.toggle('active', lang === 'zh');
      document.getElementById('btn-en').classList.toggle('active', lang === 'en');
      document.getElementById('app-title').innerText = i18n[lang].title;
      document.getElementById('title-general').innerText = i18n[lang].general;
      document.getElementById('title-check').innerText = i18n[lang].check;
      document.getElementById('btn-in').innerText = i18n[lang].btnIn;
      document.getElementById('btn-out').innerText = i18n[lang].btnOut;
      document.getElementById('btn-check').innerText = i18n[lang].btnCheck;
      document.getElementById('login-title').innerText = i18n[lang].loginTitle;
      document.getElementById('login-desc').innerText = i18n[lang].loginDesc;
      document.getElementById('logout-btn').innerText = i18n[lang].logout;
    }

    function updateClock() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      let rawHours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = rawHours >= 12 ? 'PM' : 'AM';
      let hours12 = rawHours % 12 || 12;
      document.getElementById('clock-date').innerText = `${year}-${month}-${day}`;
      document.getElementById('clock-time').innerText = `${String(hours12).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
    }

    async function submitAttendance(type) {
      if (!currentUser) {
        document.getElementById("result").innerText = i18n[currentLang].pleaseLogin;
        return;
      }

      const todayStr = new Date().toISOString().slice(0, 10);
      const recordKey = `checked_${currentUser.email}_${todayStr}`;
      let checkedTypes = JSON.parse(localStorage.getItem(recordKey) || "[]");

      const singleLimitTypes = ['IN', 'OUT'];
      if (singleLimitTypes.includes(type) && checkedTypes.includes(type)) {
        document.getElementById("result").innerText = i18n[currentLang].alreadyDone;
        return;
      }

      // 在岗查核防连击保护（1.5秒冷却）
      const btnCheck = document.getElementById('btn-check');
      if (type === 'ON_DUTY_CHECK') {
        if (btnCheck.dataset.lock === "true") return;
        btnCheck.dataset.lock = "true";
        setTimeout(() => { btnCheck.dataset.lock = "false"; }, 1500);
      }

      document.getElementById("result").innerText = i18n[currentLang].processing;

      let ipData = await fetch("https://api.ipify.org?format=json")
        .then(res => res.json())
        .catch(() => ({ ip: "Unknown" }));

      const payload = {
        ip: ipData.ip,
        type: type,
        lang: currentLang,
        browser: navigator.userAgent,
        timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
        browserLang: navigator.language,
        googleId: currentUser.uid,
        email: currentUser.email,
        name: currentUser.name,
        picture: currentUser.picture,
        googleToken: currentUser.idToken,
        timestamp: new Date().getTime(),
        nonce: Math.random().toString(36).substring(2)
      };

      try {
        await fetch(GAS_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });

        document.getElementById("result").innerText = i18n[currentLang].success;

        if (singleLimitTypes.includes(type)) {
          checkedTypes.push(type);
          localStorage.setItem(recordKey, JSON.stringify(checkedTypes));
        }

      } catch (error) {
        document.getElementById("result").innerText = i18n[currentLang].error + error.message;
      }
    }
  </script>
