<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f5f5f7"/><link rel="icon" type="image/png" href="/logo.png"/><title>TX Trading｜Market & Chips</title><meta name="description" content="MXF Trade 台指期行情圖表與策略看板。"/><meta property="og:type" content="website"/><meta property="og:url" content="https://mxf-trade.vercel.app/chart"/><meta property="og:title" content="MXF Trade｜台指期行情與策略看板"/><meta property="og:description" content="台指期行情圖表與策略看板，呈現市場走勢與策略訊號。"/><meta property="og:image" content="https://mxf-trade.vercel.app/logo.png"/><meta property="og:image:width" content="906"/><meta property="og:image:height" content="664"/><meta name="twitter:card" content="summary_large_image"/><script>
  // Apply the saved appearance before the first paint.
  (() => {
    let theme = 'system';
    try { theme = localStorage.getItem('tx-theme') || 'system'; } catch {}
    const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#161617' : '#f5f5f7';
  })();
</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
