<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#f5f5f7"/><title>TX Trading｜台指行情與籌碼</title><script>
  // Apply the saved appearance before the first paint.
  (() => {
    let theme = 'system';
    try { theme = localStorage.getItem('tx-theme') || 'system'; } catch {}
    const dark = theme === 'dark' || (theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#161617' : '#f5f5f7';
  })();
</script></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body></html>
